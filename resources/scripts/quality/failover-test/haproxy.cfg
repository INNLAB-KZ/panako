global
    maxconn 32
    nbthread 1
    stats socket /control/admin.sock mode 666 level admin

defaults
    mode http
    timeout connect 1s
    timeout client 15s
    timeout server 15s
    timeout check 1s
    retries 2
    option redispatch
    option http-server-close

frontend test_read
    bind :18123
    default_backend clickhouse_read

backend clickhouse_read
    balance roundrobin
    option allbackups
    option httpchk GET /replicas_status
    http-check expect status 200
    server main 10.0.1.2:8123 check inter 1s fall 2 rise 2
    server replica_a 10.0.0.12:8123 check inter 1s fall 2 rise 2 backup
    server replica_b 10.0.0.10:8123 check inter 1s fall 2 rise 2 backup
