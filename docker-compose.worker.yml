services:
  # HTTP API + Kafka monitor workers — 10 replicas
  panako-api:
    image: innlabkz/ozen-panako:latest
    # НЕТ container_name — конфликтует с replicas
    ports:
      - "8344-8351:8080"          # 8 портов для 8 replicas
    environment:
      - JAVA_OPTS=-Xmx2g
      - STRATEGY=OLAF
      - OLAF_STORAGE=CLICKHOUSE
      - OLAF_CLICKHOUSE_URL=jdbc:ch://${CLICKHOUSE_HOST}:8123/default?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}
      - OLAF_CACHE_TO_FILE=FALSE
      - OLAF_USE_CACHED_PRINTS=FALSE
      - SERVER_PORT=8080
      - MONITOR_STEP_SIZE=${MONITOR_STEP_SIZE:-60}
      - MONITOR_OVERLAP=${MONITOR_OVERLAP:-10}
      - MONITOR_STEP_SIZE_FINE=${MONITOR_STEP_SIZE_FINE:-15}
      - MONITOR_OVERLAP_FINE=${MONITOR_OVERLAP_FINE:-5}
      - MONITOR_PARALLEL_WINDOWS=${MONITOR_PARALLEL_WINDOWS:-2}
      - API_KEY=${API_KEY:-}
      - KAFKA_ENABLED=TRUE
      - KAFKA_MODE=MONITOR
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
    deploy:
      replicas: 8
    restart: unless-stopped

  # Kafka store worker — один
  panako-store:
    image: innlabkz/ozen-panako:latest
    container_name: ozen-panako-store
    environment:
      - JAVA_OPTS=-Xmx1g
      - STRATEGY=OLAF
      - OLAF_STORAGE=CLICKHOUSE
      - OLAF_CLICKHOUSE_URL=jdbc:ch://${CLICKHOUSE_HOST}:8123/default?user=${CLICKHOUSE_USER}&password=${CLICKHOUSE_PASSWORD}
      - OLAF_CACHE_TO_FILE=FALSE
      - OLAF_USE_CACHED_PRINTS=FALSE
      - SERVER_PORT=8081
      - KAFKA_ENABLED=TRUE
      - KAFKA_MODE=STORE
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - KAFKA_WORKER_THREADS=${KAFKA_WORKER_THREADS:-2}
    restart: unless-stopped
